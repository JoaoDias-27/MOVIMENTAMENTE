name: Ajustar cores dos cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ajustar:
    if: github.event.head_commit.message != 'style: aplicar cores finais dos cards'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar estilos
        run: |
          cat >> assets/shared.css <<'EOF'

/* ===== CORES DOS CARDS PRINCIPAIS ===== */
.library-card{
  background:linear-gradient(135deg,#12B4F0,#0B87BE)!important;
  border-color:#0B87BE!important;
  color:#fff!important;
}
.library-card h3,
.library-card p,
.library-card span{
  color:#fff!important;
}
.library-card .pillar-ico{
  background:rgba(255,255,255,.20)!important;
  color:#fff!important;
}
.about-project-card{
  background:linear-gradient(135deg,#8B5CF6,#6D28D9)!important;
  border-color:#6D28D9!important;
  color:#fff!important;
}
.about-project-card h3,
.about-project-card p,
.about-project-card span{
  color:#fff!important;
}
.about-project-card .pillar-ico{
  background:rgba(255,255,255,.20)!important;
  color:#fff!important;
}
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/shared.css
          git diff --cached --quiet && exit 0
          git commit -m "style: aplicar cores finais dos cards"
          git push

# Disparo para aplicar o ajuste na branch main.