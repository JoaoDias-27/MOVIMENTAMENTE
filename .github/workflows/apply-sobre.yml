name: Aplicar card Sobre o Projeto

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alterar Home
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<div class="card pillar-card" onclick="goTo('biblioteca')" style="border:1px solid var(--line);">\n<div aria-hidden="true" class="pillar-ico" data-icon="library" style="background:var(--bg); color:var(--blue-dark)"></div>\n<div><h3>Biblioteca Movimentamente</h3><p style="color:var(--ink-soft)">Materiais, textos e links selecionados.</p></div>\n</div>'''
          new=old+'''\n<div class="card pillar-card about-project-card" onclick="goTo('sobre')" role="button" tabindex="0" onkeydown="if(event.key==='Enter' || event.key===' ') goTo('sobre')" style="border:1px solid var(--line);">\n<div aria-hidden="true" class="pillar-ico" data-icon="info" style="background:var(--bg); color:var(--blue-dark)"></div>\n<div><h3>Sobre o Projeto</h3><p style="color:var(--ink-soft)">Conheça o Movimentamente, seus objetivos e como o projeto funciona.</p><span class="about-project-link">Conhecer o projeto →</span></div>\n</div>'''
          if 'class="about-project-card"' not in s:
              if old not in s: raise SystemExit('card Biblioteca não encontrado')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          css=Path('assets/shared.css')
          c=css.read_text(encoding='utf-8')
          marker='/* ===== SOBRE O PROJETO — HOME CARD ===== */'
          if marker not in c:
              c+='''\n\n/* ===== SOBRE O PROJETO — HOME CARD ===== */\n.about-project-card{cursor:pointer;transition:transform .15s ease,box-shadow .18s ease,border-color .18s ease;}\n.about-project-card:hover{transform:translateY(-3px);box-shadow:0 20px 34px -26px rgba(5,41,63,.55);}\n.about-project-link{display:inline-block;margin-top:8px;font-size:.78rem;font-weight:800;color:var(--blue-dark);}\n@media(max-width:600px){.about-project-card{padding:16px;gap:12px}.about-project-card .pillar-ico{width:46px;height:46px}.about-project-card h3{font-size:1rem;line-height:1.25}.about-project-card p{font-size:.82rem;line-height:1.45}.about-project-link{font-size:.76rem}}\n'''
              css.write_text(c,encoding='utf-8')
          wf=Path('.github/workflows/apply-sobre.yml')
          wf.unlink()
          PY
      - name: Validar
        run: |
          grep -q "about-project-card" index.html
          grep -q "goTo('sobre')" index.html
          grep -q "SOBRE O PROJETO — HOME CARD" assets/shared.css
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adicionar card Sobre o Projeto" || exit 0
          git push
