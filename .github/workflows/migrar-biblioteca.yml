name: Migrar Biblioteca Movimentamente

on: push

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar alterações
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          root = Path('.')

          d = root / 'estudante'
          if d.exists():
              for p in d.iterdir():
                  if p.is_file():
                      p.unlink()
              if not any(d.iterdir()):
                  d.rmdir()

          p = root / 'index.html'
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<div class="card grad-card g-orange pillar-card" onclick="goTo\(\'espaco-estudante\'\)">.*?</div>\s*</div>', '', s, count=1, flags=re.S)
          s = re.sub(r'<!--\s*4\.\s*ESPAÇO DO ESTUDANTE\s*-->.*?(?=<!--\s*5\.\s*BIBLIOTECA\s*-->)', '', s, count=1, flags=re.S|re.I)
          s = re.sub(r'<button[^>]*onclick="goTo\(\s*[\'\"]espaco-estudante[\'\"]\s*\)"[^>]*>.*?</button>', '', s, flags=re.S|re.I)
          s = s.replace('<!-- 5. BIBLIOTECA -->', '<!-- 4. BIBLIOTECA -->')
          p.write_text(s, encoding='utf-8')

          p = root / 'assets/app.js'
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"\s*\{id:'espaco-estudante',\s*label:'Espaço do Estudante',\s*icon:'student-space',\s*bottom:true,\s*bottomLabel:'Estudar'\},?", '', s)
          s = re.sub(r"\s*'espaco-estudante':\{label:'Espaço do Estudante',title:'(?:Página do estudante|Espaço do estudante)'\},?", '', s)
          s = re.sub(r"\s*'student-space':'<svg.*?</svg>',?", '', s, count=1, flags=re.S)
          replacement = r'''function renderLibraryPublic(){
            const el=document.getElementById('libraryList'); if(!el)return;
            const modules=(window._modules.biblioteca||[]).filter(m=>(m.items||[]).length);
            if(!modules.length){el.innerHTML=emptyStateMarkup('file','Nenhum material publicado ainda.<br>Volte em breve!');return;}
            el.innerHTML=modules.map(m=>`
              <div class="module-public-block">
                <div class="module-public-head"><h3>${escapeHtml(m.title)}</h3><span class="m-badge">${m.items.length} material(is)</span></div>
                ${m.items.map(it=>`<article class="resource-item"><div class="resource-ico g-purple" aria-hidden="true">📄</div><div class="resource-content">${it.topic?`<span class="resource-tag">${escapeHtml(it.topic)}</span>`:''}<h4>${escapeHtml(it.title)}</h4>${it.desc?`<p>${escapeHtml(it.desc)}</p>`:''}${it.link?`<a href="${/^https?:\/\//.test(it.link)?it.link:'#'}" target="_blank" rel="noopener noreferrer" class="resource-link">🔗 Abrir material</a>`:''}</div></article>`).join('')}
              </div>`).join('');
            updateHomeLibraryTeaser();
          }
          function updateHomeLibraryTeaser(){'''
          s, n = re.subn(r'function renderLibraryPublic\(\)\{.*?function updateHomeLibraryTeaser\(\)\{', replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('renderLibraryPublic não encontrado')
          p.write_text(s, encoding='utf-8')

          p = root / 'assets/shared.css'
          s = p.read_text(encoding='utf-8')
          marker = '/* ===== BIBLIOTECA MOBILE/TABLET — MOVIMENTAMENTE ===== */'
          if marker not in s:
              s += '''\n\n/* ===== BIBLIOTECA MOBILE/TABLET — MOVIMENTAMENTE ===== */
#page-biblioteca{overflow-x:hidden;}
#page-biblioteca .resource-item{width:100%;min-width:0;box-sizing:border-box;}
#page-biblioteca .resource-content{flex:1 1 auto;min-width:0;}
#page-biblioteca .resource-item h4,#page-biblioteca .resource-item p{overflow-wrap:anywhere;word-break:break-word;}
#page-biblioteca .resource-link{display:inline-flex;align-items:center;gap:6px;max-width:100%;box-sizing:border-box;margin-top:7px;padding:8px 12px;border-radius:10px;background:#EAF7FC;color:var(--blue-dark);font-size:.8rem;font-weight:800;line-height:1.2;text-decoration:none;}
#page-biblioteca .resource-link:hover{background:#DDF2FA;transform:translateY(-1px);}
@media(max-width:850px){#page-biblioteca .module-public-head{gap:7px;align-items:flex-start;flex-wrap:wrap;}#page-biblioteca .module-public-head h3{min-width:0;line-height:1.25;}#page-biblioteca .resource-item{gap:12px;padding:14px;}}
@media(max-width:600px){#page-biblioteca .section-title{font-size:1.3rem;line-height:1.2;}#page-biblioteca .section-sub{font-size:.88rem;line-height:1.5;}#page-biblioteca .filter-row{display:flex;flex-wrap:nowrap;overflow-x:auto;padding:2px 1px 6px;scrollbar-width:none;}#page-biblioteca .filter-row::-webkit-scrollbar{display:none;}#page-biblioteca .chip{flex:0 0 auto;white-space:nowrap;padding:7px 11px;font-size:.75rem;}#page-biblioteca .module-public-block{margin-bottom:20px;}#page-biblioteca .module-public-head h3{flex:1 1 100%;font-size:.95rem;}#page-biblioteca .module-public-head .m-badge{font-size:.68rem;}#page-biblioteca .resource-item{gap:10px;padding:13px;border-radius:16px;margin-bottom:10px;}#page-biblioteca .resource-ico{width:40px;height:40px;flex:0 0 40px;border-radius:11px;font-size:1rem;}#page-biblioteca .resource-item h4{font-size:.92rem;line-height:1.3;margin-top:5px !important;}#page-biblioteca .resource-item p{font-size:.8rem;line-height:1.45;}#page-biblioteca .resource-link{font-size:.76rem;padding:8px 10px;}}
@media(max-width:380px){#page-biblioteca .resource-item{padding:11px;}#page-biblioteca .resource-ico{width:36px;height:36px;flex-basis:36px;}#page-biblioteca .resource-item h4{font-size:.88rem;}#page-biblioteca .resource-item p{font-size:.77rem;}}\n'''
          p.write_text(s, encoding='utf-8')

          wf = root / '.github/workflows/migrar-biblioteca.yml'
          if wf.exists():
              wf.unlink()
          PY
      - name: Validar
        run: |
          test ! -d estudante
          ! grep -q "espaco-estudante" index.html
          ! grep -q "id:'espaco-estudante'" assets/app.js
          grep -q "resource-link" assets/app.js
          grep -q "BIBLIOTECA MOBILE/TABLET" assets/shared.css
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remover espaço do estudante e melhorar biblioteca mobile"
          git push
