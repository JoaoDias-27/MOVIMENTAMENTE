name: Ajustar cores dos cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar index e aplicar cores
        run: |
          git checkout e33803d750f4e098d3480d3e569c92e8595fe9d6 -- index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<div class="card pillar-card" onclick="goTo('biblioteca')" style="border:1px solid var(--line);">\n<div aria-hidden="true" class="pillar-ico" data-icon="library" style="background:var(--bg); color:var(--blue-dark)"></div>\n<div><h3>Biblioteca Movimentamente</h3><p style="color:var(--ink-soft)">Materiais, textos e links selecionados.</p></div>\n</div>'''
          new='''<div class="card pillar-card library-card" onclick="goTo('biblioteca')" style="border:1px solid var(--blue); background:linear-gradient(135deg,#ffffff 0%,#eef9fe 100%);">\n<div aria-hidden="true" class="pillar-ico" data-icon="library" style="background:#e2f5fd; color:var(--blue-dark)"></div>\n<div><h3 style="color:var(--blue-dark)">Biblioteca Movimentamente</h3><p style="color:var(--ink-soft)">Materiais, textos e links selecionados.</p></div>\n</div>'''
          if old not in s: raise SystemExit('Card Biblioteca não encontrado')
          s=s.replace(old,new,1)
          old='''<div class="card pillar-card about-project-card" onclick="goTo('sobre')" role="button" tabindex="0" onkeydown="if(event.key==='Enter' || event.key===' ') goTo('sobre')" style="border:1px solid var(--line);">\n<div aria-hidden="true" class="pillar-ico" data-icon="info" style="background:var(--bg); color:var(--blue-dark)"></div>\n<div><h3>Sobre o Projeto</h3><p style="color:var(--ink-soft)">Conheça o Movimentamente, seus objetivos e como o projeto funciona.</p><span class="about-project-link">Conhecer o projeto →</span></div>\n</div>'''
          new='''<div class="card pillar-card about-project-card" onclick="goTo('sobre')" role="button" tabindex="0" onkeydown="if(event.key==='Enter' || event.key===' ') goTo('sobre')" style="border:1px solid #8b5cf6; background:linear-gradient(135deg,#ffffff 0%,#f5efff 100%);">\n<div aria-hidden="true" class="pillar-ico" data-icon="info" style="background:#eee5ff; color:#7c3aed"></div>\n<div><h3 style="color:#6d28d9">Sobre o Projeto</h3><p style="color:var(--ink-soft)">Conheça o Movimentamente, seus objetivos e como o projeto funciona.</p><span class="about-project-link" style="color:#7c3aed">Conhecer o projeto →</span></div>\n</div>'''
          if old not in s: raise SystemExit('Card Sobre o Projeto não encontrado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -q 'library-card' index.html
          grep -q '#8b5cf6' index.html
          grep -q 'goTo('\''biblioteca'\'')' index.html
          grep -q 'goTo('\''sobre'\'')' index.html
      - name: Commitar e limpar workflow
        run: |
          rm -f .github/workflows/corrigir-cores-cards.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aplicar azul na Biblioteca e violeta no Sobre o Projeto"
          git push
